[package]
name = "c-road"
version = "0.1.0"
edition = "2021"
description = "A single-binary C editor and runner served over HTTP"
license = "MIT"

[dependencies]
actix-web = "4"
actix-ws = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread"] }
tempfile = "3"
futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"