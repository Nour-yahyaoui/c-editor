name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, bin: c-road,     out: c-road-linux }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    bin: c-road.exe, out: c-road-windows.exe }
          - { os: macos-latest,   target: x86_64-apple-darwin,       bin: c-road,     out: c-road-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.out }}
      - uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.out }}
